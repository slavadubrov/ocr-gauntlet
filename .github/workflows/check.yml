name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - run: uv sync --locked --extra gemini --extra mistral --extra dots-ocr --extra notebooks
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python scripts/check_notebooks.py
        env:
          MPLBACKEND: Agg
  docling-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - run: uv sync --locked --extra docling
      - run: uv run pytest -k docling
        env:
          HF_HUB_OFFLINE: "1"
